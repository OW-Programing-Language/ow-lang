# Entry to add to github-linguist/linguist's lib/linguist/languages.yml
# (insert in alphabetical order, under the "O" languages).
#
# Do NOT hand-pick `language_id`. Add the entry WITHOUT it, then run
#   bundle exec script/update-ids
# which assigns a unique, stable id and writes it back into languages.yml.
Ow:
  type: programming
  color: "#5b6ee1"
  extensions:
    - ".ow"
  tm_scope: source.ow
  ace_mode: text
  # language_id: <generated by script/update-ids>
