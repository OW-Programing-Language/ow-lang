name: OW native hash dictionaries

on:
  pull_request:
  push:
    paths:
      - 'src/**'
      - 'examples/native_hash_dictionaries.*'
      - 'docs/native-hash-dictionaries.md'
      - '.github/workflows/native-hash-dictionaries.yml'
      - 'pom.xml'

jobs:
  hash-dictionaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run OW Java and LLVM regression tests
        run: mvn -B clean package
      - name: Compile large three-type native hash dictionary test
        run: |
          java -jar target/OwIDE.jar llvm examples/native_hash_dictionaries.ow target/native-hash-dictionaries.ll
          clang -g -O0 -fsanitize=address -fno-omit-frame-pointer target/native-hash-dictionaries.ll -o target/native-hash-dictionaries
      - name: Check collisions, resizing, parity and ASan/LSan
        run: |
          java -jar target/OwIDE.jar run examples/native_hash_dictionaries.ow > target/hash-interpreted.txt
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 ./target/native-hash-dictionaries > target/hash-native.txt
          diff -u target/hash-interpreted.txt target/hash-native.txt
          diff -u examples/native_hash_dictionaries.expected target/hash-native.txt
      - name: Verify missing map keys still abort
        shell: bash
        run: |
          ulimit -c 0
          java -jar target/OwIDE.jar llvm examples/native_mixed_dictionaries_missing.ow target/native-hash-missing.ll
          clang target/native-hash-missing.ll -o target/native-hash-missing
          set +e
          ./target/native-hash-missing >/dev/null 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "ERROR: missing key was incorrectly accepted"
            exit 1
          fi
          echo "Missing key rejected with exit status $status"
