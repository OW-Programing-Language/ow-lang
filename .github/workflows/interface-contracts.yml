name: OW interface contract checks

on:
  push:
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/interface-contracts.yml'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compile and test interface checking
        run: mvn -B test
      - name: Build and run typed functor demonstration
        run: |
          mvn -q -DskipTests package
          java -jar target/OwIDE.jar run examples/typed_functor.ow
      - name: Reject invalid typed functor argument
        run: |
          if java -jar target/OwIDE.jar run examples/typed_functor_invalid.ow; then
            echo "ERROR: typed functor accepted an invalid module"
            exit 1
          fi
