name: OW native module calculus

on:
  push:
    paths:
      - 'src/**'
      - 'examples/module_calculus/**'
      - 'tests/module_calculus_*.ow'
      - 'tests/module_abstract_*.ow'
      - '.github/workflows/native-modules.yml'
      - 'pom.xml'
  pull_request:

jobs:
  module-calculus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compile and test
        run: mvn -B clean test package
      - name: Execute multi-file module and functor example
        run: java -jar target/OwIDE.jar run examples/module_calculus/main.ow
      - name: Verify opaque abstract type members
        run: java -jar target/OwIDE.jar run examples/module_calculus/abstract_types.ow
      - name: Verify applicative and generative identities
        run: java -jar target/OwIDE.jar run examples/module_calculus/functor_identity.ow
      - name: Verify manifest type sharing
        run: java -jar target/OwIDE.jar run examples/module_calculus/manifest_sharing.ow
      - name: Reject malformed modules, functor arguments, and hidden exports
        run: |
          for file in tests/module_calculus_*.ow tests/module_abstract_*.ow tests/module_functor_generative_mismatch.ow tests/module_manifest_mismatch.ow; do
            if java -jar target/OwIDE.jar run "$file"; then
              echo "ERROR: invalid module program was accepted: $file"
              exit 1
            fi
          done
