name: OW native module calculus

on:
  push:
    paths:
      - 'src/**'
      - 'examples/module_calculus/**'
      - 'tests/module_calculus_*.ow'
      - 'tests/module_abstract_*.ow'
      - '.github/workflows/native-modules.yml'
      - 'pom.xml'
  pull_request:

jobs:
  module-calculus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compile and test
        run: mvn -B clean test package
      - name: OW compile-time module checks without interpreter execution
        run: |
          java -jar target/OwIDE.jar check examples/module_calculus/main.ow
          java -jar target/OwIDE.jar check examples/module_calculus/set_make.ow
          java -jar target/OwIDE.jar check examples/module_calculus/named_type_sharing.ow
          java -jar target/OwIDE.jar check examples/module_calculus/dependent_result.ow
          for file in tests/module_calculus_missing_method.ow tests/module_named_type_bad_constraint.ow tests/module_named_type_cycle.ow tests/module_set_make_wrong_signature.ow tests/module_set_make_wrong_element.ow; do
            if java -jar target/OwIDE.jar check "$file"; then
              echo "ERROR: invalid module program passed static checking: $file"
              exit 1
            fi
          done
      - name: Execute multi-file module and functor example
        run: java -jar target/OwIDE.jar run examples/module_calculus/main.ow
      - name: Verify opaque abstract type members
        run: java -jar target/OwIDE.jar run examples/module_calculus/abstract_types.ow
      - name: Verify applicative and generative identities
        run: java -jar target/OwIDE.jar run examples/module_calculus/functor_identity.ow
      - name: Verify manifest type sharing
        run: java -jar target/OwIDE.jar run examples/module_calculus/manifest_sharing.ow
      - name: Validate dependent functor output sharing
        run: java -jar target/OwIDE.jar run examples/module_calculus/dependent_result.ow
      - name: Verify higher-order functor parameter and result
        run: java -jar target/OwIDE.jar run examples/module_calculus/higher_order.ow
      - name: Validate named-module type sharing
        run: java -jar target/OwIDE.jar run examples/module_calculus/named_type_sharing.ow
      - name: OCaml OrderedType / Set.Make-style comparison fixture
        run: java -jar target/OwIDE.jar run examples/module_calculus/set_make.ow
      - name: Validate qualified module definitions and signatures
        run: |
          java -jar target/OwIDE.jar check examples/module_calculus/qualified_modules.ow
          java -jar target/OwIDE.jar run examples/module_calculus/qualified_modules.ow
      - name: First-class module packages and sealing
        run: |
          java -jar target/OwIDE.jar check examples/module_calculus/first_class_modules.ow
          java -jar target/OwIDE.jar run examples/module_calculus/first_class_modules.ow
      - name: Validate implementation include and shared opaque identities
        run: |
          java -jar target/OwIDE.jar check examples/module_calculus/implementation_include.ow
          java -jar target/OwIDE.jar run examples/module_calculus/implementation_include.ow
      - name: Compile static native module functor to executable via LLVM
        run: |
          java -jar target/OwIDE.jar llvm examples/module_calculus/native_llvm.ow /tmp/ow-static-modules.ll
          clang /tmp/ow-static-modules.ll -o /tmp/ow-static-modules
          test "$(/tmp/ow-static-modules)" = "14"
      - name: Lexical nested modules and explicit signature sealing
        run: |
          java -jar target/OwIDE.jar check examples/module_calculus/lexical_nested_modules.ow
          java -jar target/OwIDE.jar run examples/module_calculus/lexical_nested_modules.ow
      - name: Reject malformed modules, functor arguments, and hidden exports
        run: |
          for file in tests/module_calculus_*.ow tests/module_abstract_*.ow tests/module_functor_generative_mismatch.ow tests/module_manifest_mismatch.ow tests/module_dependent_*.ow tests/module_higher_order_*.ow tests/module_named_type_*.ow tests/module_set_make_*.ow; do
            if java -jar target/OwIDE.jar run "$file"; then
              echo "ERROR: invalid module program was accepted: $file"
              exit 1
            fi
          done
